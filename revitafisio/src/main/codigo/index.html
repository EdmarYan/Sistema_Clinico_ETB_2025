<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="landingpage/css/global/header.css" />
    <link rel="stylesheet" href="landingpage/paginas/inicio.css" />
    <title>Revitafisio</title>
  </head>
  <body>
    <div id="header-container"></div>

    <div class="caixa-foto">
      <img src="landingpage/imagens/foto_fundo_background.png" />
      <div class="máscara"></div>
    </div>

    <section id="inicio" class="section-camada">
      <div class="camada-opaca"></div>

      <div class="bolinhas-container">
        <a href="consultas.html" class="bolinha bolinha-consultas">
          <div class="icone">
            <img src="landingpage/imagens/icone_consultas.png" alt="Consultas" />
          </div>
          <h3 class="text">CONSULTAS</h3>
        </a>

        <a
          href="consultas.html#agendar"
          class="bolinha bolinha-agenda"
          id="link-agendar"
        >
          <div class="icone">
            <img src="landingpage/imagens/icone_calendario.png" alt="agendar" />
          </div>
          <h3 class="text">AGENDAR</h3>
        </a>

        <a
          href="sobre.html#equipe"
          class="bolinha bolinha-equipe"
          id="link-equipe"
        >
          <div class="icone">
            <img src="landingpage/imagens/icone_equipe.png" alt="Equipe" />
          </div>
          <h3 class="text">EQUIPE</h3>
        </a>

        <a
          href="consultas.html#beneficios"
          class="bolinha bolinha-beneficios"
          id="link-beneficios"
        >
          <div class="icone">
            <img src="landingpage/imagens/icone_beneficios.png" alt="Benefícios" />
          </div>
          <h3 class="text">BENEFÍCIOS</h3>
        </a>

        <a
          href="contato.html#feedback"
          class="bolinha bolinha-feedback"
          id="link-feedback"
        >
          <div class="icone">
            <img src="landingpage/imagens/icone_feedback.png" alt="feedback" />
          </div>
          <h3 class="text">FEEDBACK</h3>
        </a>
      </div>
    </section>

    <div id="sobre-container"></div>
    <script src="landingpage/js/main.js"></script>

    <script src="landingpage/js/main.js"></script>
  </body>
</html>
