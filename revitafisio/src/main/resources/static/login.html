<!DOCTYPE html>
<!-- Define o documento como HTML5 e o idioma como Português do Brasil -->
<html lang="pt-BR">
<head>
    <!-- ============== CABEÇALHO E METADADOS ============== -->

    <!-- Define o conjunto de caracteres para UTF-8, o padrão da web -->
    <meta charset="UTF-8">
    <!-- Garante que a página seja renderizada corretamente em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece na aba do navegador -->
    <title>Login - Revitafisio</title>

    <!-- Vínculo com a folha de estilo externa que define toda a aparência da página -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Vínculo com a biblioteca de ícones Font Awesome, usada para os ícones no formulário -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Vínculo com as fontes do Google Fonts para uma tipografia mais profissional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- Contêiner principal que centraliza todo o conteúdo na tela -->
<div class="login-container">

    <!-- Elemento SVG usado para criar as ondas decorativas no fundo da página -->
    <div class="wave">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
        </svg>
    </div>

    <!-- O card branco que contém o formulário de login -->
    <div class="login-card">
        <div class="card-content">
            <!-- Seção do cabeçalho do card: Logo e Título -->
            <div class="text-center">
                <div class="logo-container">
                    <!-- A imagem da sua logo é inserida aqui -->
                    <img src="img/RevitafisioLogo.jpg" alt="Logo Revitafisio">
                </div>
                <h2>Área do Funcionário</h2>
                <p>Faça login para acessar o sistema</p>
            </div>

            <!-- Formulário de Login -->
            <form id="loginForm" class="login-form">
                <!-- Campo de entrada para o CPF -->
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <div class="input-container">
                        <i class="fas fa-id-card"></i> <!-- Ícone do campo -->
                        <input id="cpf" name="cpf" type="text" required maxlength="14" placeholder="000.000.000-00">
                    </div>
                </div>

                <!-- Campo de entrada para a Senha -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="senha">Senha</label>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>
                    <div class="input-container">
                        <i class="fas fa-lock"></i> <!-- Ícone do campo -->
                        <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
                        <!-- Botão para alternar a visibilidade da senha -->
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i id="eyeIcon" class="fas fa-eye"></i>
                            <i id="eyeSlashIcon" class="fas fa-eye-slash hidden"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão de submissão do formulário -->
                <div class="button-container">
                    <button type="submit" id="loginButton">
                        <span id="buttonText">Entrar</span>
                        <!-- Spinner de carregamento, inicialmente oculto -->
                        <span id="buttonSpinner" class="spinner hidden">
                                <i class="fas fa-circle-notch"></i>
                            </span>
                    </button>
                </div>

                <!-- Div vazia que será usada pelo JavaScript para exibir mensagens de erro ou sucesso -->
                <div id="resultado"></div>
            </form>

            <!-- Link para voltar à página principal do site -->
            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                    Voltar ao Site Principal
                </a>
            </div>
        </div>
    </div>

    <!-- Rodapé da página com informações de copyright -->
    <div class="footer">
        &copy; 2025 Revitafisio. Todos os direitos reservados.
    </div>
</div>

<!-- Vínculo com o arquivo JavaScript externo que contém toda a lógica da página -->
<script src="js/script.js"></script>
</body>
</html>
