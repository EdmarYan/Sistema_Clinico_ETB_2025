<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Revitafisio</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <link href="css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-xl-6 col-lg-8 col-md-9">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Área do Funcionário</h1>
                                </div>
                                <form id="loginForm" class="user">
                                    <div class="form-group">
                                        <input type="text" class="form-control form-control-user" id="cpf" placeholder="Digite seu CPF..." required>
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user" id="senha" placeholder="Senha" required>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        Entrar
                                    </button>

                                    <hr>
                                    <div id="resultado" class="mt-3"></div>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="index.html">‹ Voltar ao Site Principal</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="vendor/jquery-easing/jquery.easing.min.js"></script>

<script src="js/sb-admin-2.min.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        fazerLogin();
    });

    async function fazerLogin() {
        const cpf = document.getElementById('cpf').value;
        const senha = document.getElementById('senha').value;
        const resultadoDiv = document.getElementById('resultado');

        const dados = { cpf: cpf, senha: senha };

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            resultadoDiv.className = '';
            resultadoDiv.textContent = '';

            if (response.ok) {
                const dadosUsuario = await response.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(dadosUsuario));
                window.location.href = 'pages/dashboard/dashboard.html';
            } else {
                const erro = await response.json();
                resultadoDiv.className = 'alert alert-danger text-center';
                resultadoDiv.textContent = `Erro: ${erro.message || 'CPF ou senha inválidos.'}`;
            }
        } catch (error) {
            resultadoDiv.className = 'alert alert-danger text-center';
            resultadoDiv.textContent = 'Erro de conexão. Tente novamente mais tarde.';
            console.error('Erro no fetch:', error);
        }
    }
</script>

</body>

</html>
