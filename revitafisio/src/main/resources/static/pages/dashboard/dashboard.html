<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ============== CABEÇALHO E METADADOS ============== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dashboard - Revitafisio</title>

    <!-- Vínculos com as folhas de estilo: Font Awesome para ícones e SB Admin 2 para o layout principal. -->
    <link href="../../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="../../css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
<!-- O 'wrapper' é o contêiner principal que envolve o sidebar e a área de conteúdo. -->
<div id="wrapper">

    <!-- =============================================================== -->
    <!-- ======================= SIDEBAR (MENU LATERAL) ================ -->
    <!-- =============================================================== -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <!-- Logo e Nome do Sistema -->
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="dashboard.html">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-heartbeat"></i></div>
            <div class="sidebar-brand-text mx-3">Revitafisio</div>
        </a>
        <hr class="sidebar-divider my-0">
        <!-- Link principal para o Dashboard -->
        <li class="nav-item active">
            <a class="nav-link" href="dashboard.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a>
        </li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">Gestão</div>

        <!-- PLACEHOLDER PARA OS LINKS DINÂMICOS -->
        <!-- Este 'div' será preenchido pelo dashboard.js com os links de menu
             apropriados para o tipo de usuário logado (Admin, Fisioterapeuta, etc.). -->
        <div id="sidebar-links"></div>

        <hr class="sidebar-divider d-none d-md-block">
        <!-- Botão para recolher/expandir o sidebar -->
        <div class="text-center d-none d-md-inline"><button class="rounded-circle border-0" id="sidebarToggle"></button></div>
    </ul>

    <!-- =============================================================== -->
    <!-- ==================== ÁREA DE CONTEÚDO PRINCIPAL ================ -->
    <!-- =============================================================== -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <!-- Barra de Navegação Superior (Topbar) -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3"><i class="fa fa-bars"></i></button>
                <ul class="navbar-nav ml-auto">
                    <!-- Dropdown de Informações do Usuário -->
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                            <!-- O nome do usuário será inserido aqui pelo JavaScript -->
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userName"></span>
                            <img class="img-profile rounded-circle" src="../../img/undraw_profile.svg">
                        </a>
                        <!-- Menu Dropdown com a opção de Sair -->
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                            <a class="dropdown-item" href="#" id="logoutButton"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Sair</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <!-- Container Principal do Conteúdo da Página -->
            <div class="container-fluid">
                <!-- Título da Página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
                </div>

                <!-- PLACEHOLDER PARA OS CARDS DE ATALHO -->
                <!-- Esta 'row' será preenchida pelo dashboard.js com os cards de acesso rápido
                     (ex: "Novo Cadastro", "Acessar Agenda") de acordo com o perfil do usuário. -->
                <div class="row" id="cards-container"></div>

                <!-- Card de Busca de Paciente -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Buscar Paciente</h6></div>
                    <div class="card-body">
                        <!-- Formulário para iniciar a busca -->
                        <form id="formBuscaPaciente" class="mb-4">
                            <div class="input-group">
                                <input type="text" class="form-control" id="buscaInput" placeholder="Digite o nome ou CPF do paciente...">
                                <button class="btn btn-primary" type="submit"><i class="fas fa-search fa-sm"></i></button>
                            </div>
                        </form>
                        <!-- Tabela para exibir os resultados da busca -->
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%">
                                <thead><tr><th>Nome</th><th>CPF</th><th>Ações</th></tr></thead>
                                <!-- O corpo da tabela será preenchido dinamicamente pelo JavaScript -->
                                <tbody id="listaResultados"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Rodapé Fixo -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto"><div class="copyright text-center my-auto"><span>Copyright &copy; Revitafisio 2025</span></div></div>
        </footer>
    </div>
</div>

<!-- Scripts essenciais para o funcionamento do template SB Admin 2 -->
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="../../js/sb-admin-2.min.js"></script>

<!-- Vínculo com o arquivo JavaScript específico desta página -->
<script src="dashboard.js"></script>
</body>
</html>
