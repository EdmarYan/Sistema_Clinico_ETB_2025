<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ============== CABEÇALHO E METADADOS ============== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro de Paciente - Revitafisio</title>

    <!-- Folhas de estilo -->
    <link href="../../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="../../css/sb-admin-2.min.css" rel="stylesheet">

    <!-- Estilos customizados -->
    <style>
        .contato-item {
            background-color: #f8f9fc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .btn-remove-contato {
            transition: all 0.3s;
        }

        .btn-remove-contato:hover {
            transform: scale(1.1);
        }

        .required-field::after {
            content: " *";
            color: #e74a3b;
        }
    </style>
</head>

<body id="page-top">
<div id="wrapper">
    <!-- Sidebar -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="../dashboard/dashboard.html">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-heartbeat"></i></div>
            <div class="sidebar-brand-text mx-3">Revitafisio</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item"><a class="nav-link" href="../dashboard/dashboard.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">Gestão</div>
        <div id="sidebar-links"></div>
    </ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userName"></span>
                            <img class="img-profile rounded-circle" src="../../img/undraw_profile.svg">
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                            <a class="dropdown-item" href="#" id="logoutButton"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Sair</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">Cadastro de Novo Paciente</h1>

                <!-- Card principal -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-primary">Dados do Paciente</h6>
                        <div id="form-status" class="small text-muted"></div>
                    </div>

                    <div class="card-body">
                        <form id="formCadastroPaciente" novalidate>
                            <!-- Seção de Dados Pessoais -->
                            <fieldset class="mb-4 p-3 border rounded">
                                <legend class="h6 font-weight-bold text-primary mb-3">
                                    <i class="fas fa-user-circle mr-2"></i>Informações Pessoais
                                </legend>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nome" class="form-label required-field">Nome Completo</label>
                                        <input type="text" class="form-control" id="nome" required
                                               placeholder="Ex: João da Silva">
                                        <div class="invalid-feedback">Por favor, informe o nome completo</div>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="cpf" class="form-label required-field">CPF</label>
                                        <input type="text" class="form-control" id="cpf" required
                                               placeholder="000.000.000-00">
                                        <div class="invalid-feedback">CPF inválido</div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="dataNascimento" class="form-label required-field">Data de Nascimento</label>
                                        <input type="date" class="form-control" id="dataNascimento" required>
                                        <div class="invalid-feedback">Data inválida</div>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Seção de Contatos -->
                            <fieldset class="mb-4 p-3 border rounded">
                                <legend class="h6 font-weight-bold text-primary mb-3 d-flex justify-content-between align-items-center">
                                    <span><i class="fas fa-address-book mr-2"></i>Informações de Contato</span>
                                    <button type="button" id="addContatoBtn" class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-plus mr-1"></i> Adicionar Contato
                                    </button>
                                </legend>

                                <div id="contatosContainer">
                                    <!-- Campos dinâmicos serão inseridos aqui -->
                                </div>

                                <div id="contato-validation" class="text-danger small mt-2 d-none">
                                    Pelo menos um contato válido é necessário
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-between mt-4">
                                <button type="reset" class="btn btn-secondary">
                                    <i class="fas fa-eraser mr-2"></i> Limpar
                                </button>

                                <button type="submit" class="btn btn-primary" id="submitButton">
                                    <i class="fas fa-save mr-2"></i> Cadastrar Paciente
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Revitafisio 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<!-- Scripts -->
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../js/sb-admin-2.min.js"></script>
<script src="cadastro-paciente.js"></script>
</body>
</html>
