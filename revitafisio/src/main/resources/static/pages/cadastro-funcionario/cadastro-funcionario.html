<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ============== CABEÇALHO E METADADOS ============== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro de Funcionário - Revitafisio</title>

    <!-- Vínculos com as folhas de estilo do Font Awesome e do tema SB Admin 2 -->
    <link href="../../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="../../css/sb-admin-2.min.css" rel="stylesheet">
    <!-- Folha de estilo customizada para esta página, se necessário -->
    <link href="cadastro-funcionario.css" rel="stylesheet">
</head>

<body id="page-top">
<!-- O 'wrapper' é o contêiner principal que envolve o sidebar e a área de conteúdo. -->
<div id="wrapper">
    <!-- ======================= SIDEBAR (MENU LATERAL) ================ -->
    <!-- Estrutura padrão do menu lateral, será preenchida dinamicamente pelo JS. -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="../dashboard/dashboard.html">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-heartbeat"></i></div>
            <div class="sidebar-brand-text mx-3">Revitafisio</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item"><a class="nav-link" href="../dashboard/dashboard.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">Gestão</div>
        <div id="sidebar-links"></div>
        <hr class="sidebar-divider d-none d-md-block">
        <div class="text-center d-none d-md-inline"><button class="rounded-circle border-0" id="sidebarToggle"></button></div>
    </ul>

    <!-- ==================== ÁREA DE CONTEÚDO PRINCIPAL ================ -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <!-- Barra de Navegação Superior (Topbar) padrão -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3"><i class="fa fa-bars"></i></button>
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userName"></span>
                            <img class="img-profile rounded-circle" src="../../img/undraw_profile.svg">
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                            <a class="dropdown-item" href="#" id="logoutButton"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Sair</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <!-- Container Principal do Conteúdo da Página -->
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">Cadastro de Novo Funcionário</h1>

                <!-- Card principal que contém o formulário de cadastro -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Dados do Novo Funcionário</h6>
                    </div>
                    <div class="card-body">
                        <!-- Formulário de Cadastro -->
                        <form id="formCadastroFuncionario">
                            <!-- Seção de Dados Pessoais -->
                            <fieldset class="mb-4">
                                <legend class="h6 font-weight-bold text-primary mb-3">Informações Pessoais</legend>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nome" class="form-label">Nome Completo</label>
                                        <input type="text" class="form-control" id="nome" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="cpf" class="form-label">CPF</label>
                                        <input type="text" class="form-control" id="cpf" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                        <input type="date" class="form-control" id="dataNascimento">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="senha" class="form-label">Senha Provisória</label>
                                        <input type="password" class="form-control" id="senha" required>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Seção de Cargo -->
                            <fieldset class="mb-4">
                                <legend class="h6 font-weight-bold text-primary mb-3">Cargo</legend>
                                <div class="mb-3">
                                    <label for="tipo" class="form-label">Tipo de Funcionário</label>
                                    <select class="form-select custom-select" id="tipo" required>
                                        <option value="" selected disabled>Selecione um tipo...</option>
                                        <option value="FISIOTERAPEUTA">Fisioterapeuta</option>
                                        <option value="RECEPCIONISTA">Recepcionista</option>
                                        <option value="ADMIN">Administrador</option>
                                    </select>
                                    <div class="invalid-feedback">Selecione um tipo de funcionário</div>
                            </fieldset>

                            <!-- ============== NOVA SEÇÃO DE CONTATOS ============== -->
                            <fieldset class="mb-4">
                                <legend class="h6 font-weight-bold text-primary mb-3 d-flex justify-content-between align-items-center">
                                    <span>Informações de Contato</span>
                                    <!-- Botão para adicionar novos campos de contato -->
                                    <button type="button" id="addContatoBtn" class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-plus mr-1"></i> Adicionar Contato
                                    </button>
                                </legend>
                                <!-- Contêiner onde os campos de contato dinâmicos serão inseridos pelo JS -->
                                <div id="contatosContainer">
                                    <!-- Campos de contato serão adicionados aqui -->
                                </div>
                            </fieldset>

                            <hr>
                            <!-- Botão de submissão do formulário -->
                            <button type="submit" class="btn btn-primary">Cadastrar Funcionário</button>
                            <!-- Div para exibir mensagens de erro ou sucesso -->
                            <div id="resultado" class="mt-3"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Rodapé Fixo -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto"><div class="copyright text-center my-auto"><span>Copyright &copy; Revitafisio 2025</span></div></div>
        </footer>
    </div>
</div>

<!-- Scripts essenciais do template e o script específico da página -->
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="../../js/sb-admin-2.min.js"></script>
<script src="cadastro-funcionario.js"></script>
</body>
</html>
