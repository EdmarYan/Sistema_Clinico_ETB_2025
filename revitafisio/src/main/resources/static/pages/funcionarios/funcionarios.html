<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gerenciar Equipe e Pacientes - Revitafisio</title>

    <!-- Estilos do Tema e Ícones -->
    <link href="../../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="../../css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">
    <!-- Sidebar (Menu Lateral) -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="../dashboard/dashboard.html">
            <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-heartbeat"></i></div>
            <div class="sidebar-brand-text mx-3">Revitafisio</div>
        </a>
        <hr class="sidebar-divider my-0">
        <li class="nav-item"><a class="nav-link" href="../dashboard/dashboard.html"><i class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a></li>
        <hr class="sidebar-divider">
        <div class="sidebar-heading">Gestão</div>
        <!-- Links da Sidebar serão inseridos aqui pelo JS -->
        <div id="sidebar-links"></div>
    </ul>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <!-- Topbar (Barra Superior) -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userName"></span>
                            <img class="img-profile rounded-circle" src="../../img/undraw_profile.svg">
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                            <a class="dropdown-item" href="#" id="logoutButton"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Sair</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <!-- Conteúdo Principal da Página -->
            <div class="container-fluid">
                <!-- Título e Botão de Adicionar Novo -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Gerenciar Equipe e Pacientes</h1>
                    <div>
                        <a href="../cadastro-paciente/cadastro-paciente.html" class="btn btn-info shadow-sm"><i class="fas fa-user-plus fa-sm text-white-50"></i> Adicionar Paciente</a>
                        <a href="../cadastro-funcionario/cadastro-funcionario.html" class="btn btn-primary shadow-sm"><i class="fas fa-user-cog fa-sm text-white-50"></i> Adicionar Funcionário</a>
                    </div>
                </div>

                <!-- Seção de Gerenciamento de Funcionários -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Equipe de Funcionários</h6></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Filtrar funcionários por status:</label>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-funcionarios-ativos">Ver Ativos</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-funcionarios-inativos">Ver Inativos</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead><tr><th>Nome</th><th>Cargo</th><th>Ações</th></tr></thead>
                                <tbody id="listaFuncionarios"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Seção de Gerenciamento de Pacientes -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Pacientes</h6></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Filtrar pacientes por status:</label>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-primary btn-sm" id="btn-pacientes-ativos">Ver Ativos</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-pacientes-inativos">Ver Inativos</button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead><tr><th>Nome</th><th>CPF</th><th style="width: 280px;">Ações</th></tr></thead>
                                <tbody id="listaPacientes"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <!-- Footer -->
        <footer class="sticky-footer bg-white"><div class="container my-auto"><div class="copyright text-center my-auto"><span>Copyright &copy; Revitafisio 2025</span></div></div></footer>
    </div>
</div>

<!-- =============================================================== -->
<!-- ============= MODAL DE CONFIRMAÇÃO GENÉRICO =================== -->
<!-- =============================================================== -->
<!-- Este modal fica oculto e será ativado e preenchido pelo JavaScript -->
<div class="modal fade" id="confirmationModal" tabindex="-1" role="dialog" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">Confirmar Ação</h5>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body" id="confirmationModalBody">
                <!-- A mensagem de confirmação será inserida aqui pelo JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancelar</button>
                <!-- O botão de confirmação não faz nada por padrão. O JS adicionará a ação. -->
                <button class="btn btn-primary" id="confirmActionBtn">Confirmar</button>
            </div>
        </div>
    </div>
</div>


<!-- Scripts essenciais do tema -->
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../js/sb-admin-2.min.js"></script>

<!-- Nosso script customizado -->
<script src="funcionarios.js"></script>
</body>
</html>
